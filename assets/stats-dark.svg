<svg width="680" height="250" viewBox="0 0 680 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub Stats for kauan-piacente">
  <style>
    .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
